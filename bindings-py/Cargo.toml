[package]
name = "bindings-py"
version.workspace = true
edition.workspace = true

[lib]
name = "genpnize"
crate-type = ["cdylib"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap-stdin = "0.8"
genpnize-core = { path = "../genpnize-core" }
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py310"] }
